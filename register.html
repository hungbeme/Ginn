<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <meta name="title" content="GiNN Registration - Join the Movement" />
    <meta
      name="description"
      content="Register for GiNN 5.0 and become part of a youth movement shaping Nigeria’s future through leadership, innovation, and action."
    />
    <meta
      name="keywords"
      content="GiNN registration, join GiNN, Nigeria youth event, Gen Z Nigeria event, leadership program Nigeria, student registration Nigeria"
    />
    <meta name="author" content="GiNN Team" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GiNN Registration - Join the Movement" />
    <meta
      property="og:description"
      content="Register for GiNN 5.0 and join thousands of young Nigerians building the future."
    />
    <meta
      property="og:image"
      content="/assets/images/GINN-host.jpg-819x1024.jpeg"
    />
    <meta property="og:url" content="https://your-domain.com/register.html" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:title"
      content="GiNN Registration - Join the Movement"
    />
    <meta
      property="twitter:description"
      content="Be part of GiNN 5.0 — register and join Nigeria’s Gen Z movement."
    />
    <meta
      property="twitter:image"
      content="/assets/images/GINN-host.jpg-819x1024.jpeg"
    />

    <title>GiNN Registration - Join the Movement</title>
    <link rel="icon" href="./assets/images/GinnLogo.jpeg" />

    <link rel="stylesheet" href="./css/register.css" />
    <script defer src="./js/register.js"></script>
  </head>

  <body>
    <div class="container">
      <form id="register-form" class="form">
        <h1>GiNN 5.0 Registration</h1>
        <p class="subtitle">Join the movement shaping Nigeria’s future</p>

        <div class="input-group">
          <label>Full Name</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="John Doe"
          />
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
          />
        </div>

        <div class="input-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+234..." />
        </div>

        <div class="input-group">
          <label>State of Residence</label>
          <input type="text" id="state" name="state" placeholder="Lagos" />
        </div>

        <div class="input-group">
          <label>Why do you want to join GiNN?</label>
          <textarea
            id="reason"
            name="reason"
            rows="4"
            placeholder="Tell us briefly..."
          ></textarea>
        </div>

        <input type="text" name="_gotcha" style="display: none" />

        <button type="submit">Register</button>

        <p id="message"></p>
      </form>
    </div>
  </body>
</html>
